<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S1</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:white;overflow:hidden;font:16px Arial}video{width:100vw;height:100vh;object-fit:contain;background:#000;display:block}#label{position:fixed;top:12px;left:12px;background:#0009;padding:8px 12px;border-radius:8px;opacity:0;transition:.3s}body:hover #label{opacity:1}#gate{position:fixed;inset:0;background:#050812;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px}button{padding:14px 22px;border:0;border-radius:9px;background:#1769ff;color:#fff;font-weight:bold;cursor:pointer;font-size:16px}</style></head><body>
<video id="v" controls autoplay playsinline></video><div id="label">Loading default channel…</div><div id="gate"><h2 id="title">S1</h2><div id="msg">Trying to load the saved default channel…</div><button id="go">Start / Full Screen</button></div>
<script>
const v=document.getElementById('v'),label=document.getElementById('label'),gate=document.getElementById('gate'),title=document.getElementById('title'),msg=document.getElementById('msg');let hls=null,lastId=0,loadedUrl='';
function playChannel(name,url){if(!url||url===loadedUrl)return;loadedUrl=url;label.textContent=name||'Now Playing';title.textContent=name||'Now Playing';if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().then(()=>gate.style.display='none').catch(()=>{msg.textContent='Click Start / Full Screen to begin playback.';gate.style.display='flex'}))}else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;v.play().then(()=>gate.style.display='none').catch(()=>{msg.textContent='Click Start / Full Screen to begin playback.';gate.style.display='flex'})}else{msg.textContent='This browser does not support this stream format.';gate.style.display='flex'}}
async function loadDefault(){try{let r=await fetch('/api/default?ts='+Date.now(),{cache:'no-store'}),d=await r.json();if(d.url)playChannel(d.name,d.url);else msg.textContent='No default channel saved. Set one from the sender page.'}catch(e){msg.textContent='Waiting for Python host…'}}
async function poll(){try{let r=await fetch('/api/current?ts='+Date.now(),{cache:'no-store'}),d=await r.json();if(d.id&&d.id!==lastId&&d.url){lastId=d.id;playChannel(d.name,d.url)}}catch(e){}}
async function go(){try{await document.documentElement.requestFullscreen()}catch(e){}try{await v.play();gate.style.display='none'}catch(e){msg.textContent='Playback needs a user click. Press Play on the video if required.'}}
document.getElementById('go').onclick=go;loadDefault();poll();setInterval(poll,1000);
// Try fullscreen on launch; browsers commonly require a user gesture, so the button remains as fallback.
window.addEventListener('load',()=>{document.documentElement.requestFullscreen?.().catch(()=>{})});
</script></body></html>
