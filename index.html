<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPTV Channel Directory - Working Channels</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f4f7ff;font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:#0c1324f5;padding:18px clamp(14px,4vw,40px);border-bottom:1px solid #ffffff20;backdrop-filter:blur(8px)}
h1{margin:0 0 4px;font-size:clamp(22px,3vw,32px)}
p{color:#aab6d3;margin:0 0 12px}
.controls{display:grid;grid-template-columns:minmax(220px,1fr) repeat(4,minmax(135px,auto));gap:9px}
input,select{min-width:0;padding:11px;border-radius:10px;border:1px solid #344363;background:#18233b;color:white;font:inherit}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.tab{background:#17243d;color:white;border:1px solid #344363;border-radius:999px;padding:8px 13px;cursor:pointer}
.tab.active{background:#17628a;border-color:#58c4ff}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.stat{background:#141e34;border:1px solid #ffffff14;border-radius:9px;padding:7px 10px;color:#cbd7ed}
.stat b{color:white}
#count{color:#aab6d3;margin-top:10px}
main{padding:20px clamp(14px,4vw,40px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{width:100%;min-height:128px;text-align:left;padding:14px;border:1px solid #ffffff18;border-radius:14px;background:linear-gradient(145deg,#1b2945,#141d32);color:#f4f7ff;cursor:pointer;overflow-wrap:anywhere;transition:.15s}
.card:hover{border-color:#58c4ff;transform:translateY(-2px)}
.channel-name{font-size:15px;font-weight:700;line-height:1.35}
.metadata{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:11px;background:#293958;color:#c7d8f5;border-radius:6px;padding:3px 6px}
.empty{padding:35px;text-align:center;color:#aab6d3}
dialog{width:min(920px,96vw);padding:0;border:1px solid #405276;border-radius:16px;background:#080d18;color:white}
dialog::backdrop{background:#000b}
.player-head{display:flex;gap:12px;align-items:center;padding:14px}
.player-head strong{flex:1}
button.close{padding:8px 13px;background:#293650;color:white;border:0;border-radius:8px;cursor:pointer}
video{width:100%;aspect-ratio:16/9;background:#000;max-height:70vh}
.foot{padding:14px;color:#aab6d3;font-size:13px}
.foot a,.foot button{display:inline-block;margin:8px 8px 0 0;padding:9px 12px;border:1px solid #3b4e70;border-radius:8px;background:#17243d;color:white;text-decoration:none;cursor:pointer}
.section-title{font-size:18px;margin:0 0 12px}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr 1fr}.controls #search{grid-column:1/-1}}
@media(max-width:560px){.controls{grid-template-columns:1fr 1fr}.controls #search{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:11px}}
</style>
</head>
<body>
<header>
  <h1>📺 IPTV Channel Directory</h1>
  <p>Working channels organized by language, country and quality.</p>

  <div class="controls">
    <input id="search" type="search" placeholder="Search channel name…">
    <select id="language"><option value="">All languages</option></select>
    <select id="country"><option value="">All countries</option></select>
    <select id="quality"><option value="">All qualities</option></select>
    <select id="sort">
      <option value="name">Sort: Name</option>
      <option value="quality">Sort: Quality</option>
      <option value="country">Sort: Country</option>
      <option value="language">Sort: Language</option>
    </select>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="all">All channels</button>
    <button class="tab" data-view="language">Languages</button>
    <button class="tab" data-view="country">Countries</button>
    <button class="tab" data-view="quality">Quality</button>
  </div>

  <div class="stats">
    <div class="stat">Channels <b id="total">0</b></div>
    <div class="stat">Shown <b id="shown">0</b></div>
    <div class="stat">4K <b id="q4k">0</b></div>
    <div class="stat">1080p <b id="q1080">0</b></div>
    <div class="stat">720p <b id="q720">0</b></div>
    <div class="stat">SD <b id="qsd">0</b></div>
  </div>
  <div id="count"></div>
</header>

<main>
  <h2 id="heading" class="section-title">All working channels</h2>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>No matching channels found.</div>
</main>

<dialog id="dlg">
  <div class="player-head">
    <strong id="playingName"></strong>
    <button class="close" id="close">✕</button>
  </div>
  <video id="video" controls autoplay playsinline></video>
  <div class="foot">
    <span id="playerInfo"></span><br>
    <a id="openStream" href="#" target="_blank" rel="noopener">Open stream URL</a>
  </div>
</dialog>

let filtered = [...channels];
let currentView = "all";
let hls = null;

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const search = document.getElementById("search");
const language = document.getElementById("language");
const country = document.getElementById("country");
const quality = document.getElementById("quality");
const sort = document.getElementById("sort");

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function uniqueSorted(field){
  return [...new Set(channels.map(x => x[field]).filter(x => x && x !== "Unknown"))]
    .sort((a,b)=>a.localeCompare(b));
}

function fillSelect(el, values){
  for(const v of values){
    const o=document.createElement("option");
    o.value=v;
    o.textContent=v;
    el.appendChild(o);
  }
}

fillSelect(language, uniqueSorted("language"));
fillSelect(country, uniqueSorted("country"));
fillSelect(quality, uniqueSorted("quality_group"));

document.getElementById("total").textContent = channels.length.toLocaleString();
document.getElementById("q4k").textContent = channels.filter(x=>x.quality_group==="4K").length.toLocaleString();
document.getElementById("q1080").textContent = channels.filter(x=>x.quality_group==="1080p / Full HD").length.toLocaleString();
document.getElementById("q720").textContent = channels.filter(x=>x.quality_group==="720p / HD").length.toLocaleString();
document.getElementById("qsd").textContent = channels.filter(x=>x.quality_group==="SD").length.toLocaleString();

function qualityRank(x){
  const q=(x.quality||"").toLowerCase();
  if(q==="2160p" || x.quality_group==="4K") return 2160;
  const m=q.match(/(\d+)p/);
  return m ? Number(m[1]) : 0;
}

function getFiltered(){
  const term=search.value.trim().toLowerCase();

  let data=channels.filter(c=>{
    const okSearch=!term || String(c.name).toLowerCase().includes(term);
    const okLang=!language.value || c.language===language.value;
    const okCountry=!country.value || c.country===country.value;
    const okQuality=!quality.value || c.quality_group===quality.value;
    return okSearch && okLang && okCountry && okQuality;
  });

  if(sort.value==="quality"){
    data.sort((a,b)=>qualityRank(b)-qualityRank(a) || a.name.localeCompare(b.name));
  } else if(sort.value==="country"){
    data.sort((a,b)=>a.country.localeCompare(b.country) || a.name.localeCompare(b.name));
  } else if(sort.value==="language"){
    data.sort((a,b)=>a.language.localeCompare(b.language) || a.name.localeCompare(b.name));
  } else {
    data.sort((a,b)=>a.name.localeCompare(b.name));
  }

  return data;
}

function render(){
  filtered=getFiltered();
  grid.innerHTML="";
  document.getElementById("shown").textContent=filtered.length.toLocaleString();
  document.getElementById("count").textContent =
    `${filtered.length.toLocaleString()} channel${filtered.length===1?"":"s"} shown`;

  const titles={
    all:"All working channels",
    language:"Browse by language",
    country:"Browse by country",
    quality:"Browse by quality"
  };
  document.getElementById("heading").textContent=titles[currentView];

  empty.hidden=filtered.length!==0;

  const frag=document.createDocumentFragment();

  for(const c of filtered){
    const card=document.createElement("button");
    card.className="card";
    card.innerHTML=`
      <div class="channel-name">${esc(c.name)}</div>
      <div class="metadata">
        <span class="tag">🌐 ${esc(c.language||"Unknown")}</span>
        <span class="tag">📍 ${esc(c.country||"Unknown")}</span>
        <span class="tag">📺 ${esc(c.quality_group||"Unknown")}</span>
      </div>`;
    card.addEventListener("click",()=>playChannel(c));
    frag.appendChild(card);
  }
  grid.appendChild(frag);
}

function playChannel(c){
  const dlg=document.getElementById("dlg");
  const video=document.getElementById("video");
  const open=document.getElementById("openStream");

  document.getElementById("playingName").textContent=c.name;
  document.getElementById("playerInfo").textContent =
    `${c.language||"Unknown"} • ${c.country||"Unknown"} • ${c.quality_group||"Unknown"}`;

  open.href=c.url;

  if(hls){ hls.destroy(); hls=null; }
  video.pause();
  video.removeAttribute("src");
  video.load();

  if(window.Hls && Hls.isSupported()){
    hls=new Hls({enableWorker:true});
    hls.loadSource(c.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=c.url;
    video.addEventListener("loadedmetadata",()=>video.play().catch(()=>{}),{once:true});
  } else {
    video.src=c.url;
  }

  if(!dlg.open) dlg.showModal();
}

document.getElementById("close").onclick=()=>{
  const video=document.getElementById("video");
  video.pause();
  if(hls){hls.destroy();hls=null;}
  document.getElementById("dlg").close();
};

document.getElementById("dlg").addEventListener("click",e=>{
  if(e.target.id==="dlg") document.getElementById("close").click();
});

[search,language,country,quality,sort].forEach(x=>x.addEventListener("input",render));

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    tab.classList.add("active");
    currentView=tab.dataset.view;
    render();
  });
});

render();
</script>
</body>
</html>
